# Build com Vite: publica dist/ (gerado por `bun run build`).
[build]
  publish = "dist"
  command = "bun install --frozen-lockfile && bun run build"

# HTML sempre revalidado: uma mudança de deploy aparece na hora.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# CSS e JS são revalidados a cada carregamento. Com cache de 1 dia, o navegador podia
# misturar um index.html novo com um app.js antigo (ex.: "null is not an object
# (evaluating 'shareBtn.addEventListener')"). Revalidar usa ETag e responde 304 quando
# nada mudou, então o custo continua baixo.
[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
